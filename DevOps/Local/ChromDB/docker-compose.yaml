name: ai-agents-with-langchain

services:
  chromadb:
    image: chromadb/chroma:latest
    container_name: ai-agents-with-langchain-chromadb
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/data
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
      CHROMA_CORS_ALLOW_ORIGINS: '["http://localhost:7070","http://127.0.0.1:7070","http://localhost:8090","http://127.0.0.1:8090"]'
    restart: unless-stopped

volumes:
  chroma_data:
